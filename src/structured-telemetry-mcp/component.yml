risk:
  level: "medium"
  items:
    - "initiative_id nullable — COALESCE required in group_by to avoid null group keys (R-002)"
    - "event_log dispatch order — must precede existing checks in dispatchQuery (R-003)"
    - "AJV recompilation — schema additions only active after daemon restart; mitigated by `npm run deploy` auto-restarting an active service, but the underlying fact (compiled validator lives in memory until reload) remains true (R-004)"
    - "Truncation script DB path resolution — must print path before prompting (R-006)"
    - "~/Library/LaunchAgents root-owned by MDM policy on some machines — pre-flight write-test + sudo fallback required (plan/current/risk-register.md R-001)"
    - "Linux systemd unit design untested on real hardware this session — verify before shipping Phase 2 (R-002)"
    - "systemd --user lingering disabled by default on headless/dev boxes — post-install check required (R-003)"
    - "emit_event's 3 enforcement points (Zod enum, ajv schema, EVENT_REQUIRED_DATA_FIELDS) must land together or they drift out of sync (R-004)"
    - "emit_event argument rename (event -> envelope) is a breaking change for any caller on the old shape (R-005)"
    - "ADR-010 scope-filter removal is enforced in two places (src/query/event-log.ts and src/server-factory.ts dispatchQuery) that must change together (0000015 R-001)"
    - "Three existing tests assert the old scope-required error and will fail until updated: tests/unit/server-factory.test.ts:125, tests/integration/query-telemetry.test.ts:256, tests/regression/query-routing.test.ts:132 (0000015 R-002)"
    - "product_id migration requires human approval before req-002/003/004 can build against the new column — sequence product_id first (0000015 R-004)"
    - "E2E per-file ephemeral server startup could push combined CI runtime past the 5-min budget as suites grow — measure at P4, fall back to a shared-server pattern if threatened (0000016 R-001)"
    - "E2E harness must bind ephemeral ports via OS-assigned port 0, never hardcoded, to avoid collisions across parallel test workers (0000016 R-002)"
    - "E2E harness must explicitly bind 127.0.0.1, never 0.0.0.0, to avoid introducing new network exposure during test runs (0000016 R-005)"
    - "sortField (event_log) and field (distinct_values) are both column-identifier inputs — DuckDB has no parameterized-identifier binding, so both MUST validate against a shared allow-list before any SQL interpolation, or both become SQL-injection-via-identifier vectors (0000017 R-001, plan/current/risk-register.md)"
    - "req-001/002/003 all extend the same shared state-management functions in the single src/ui/index-html.ts embedded script (readStateFromUrl, writeStateToUrl, applyStateToForm, readFormIntoFilters) — must be implemented as one integrated pass, not three independently-parallelised edits, to avoid clobbering (0000017 R-002)"
    - "Backup runs in-process on the daemon's own DuckDB connection (ADR-029) — no external scheduler, so no second connection ever opens telemetry.db; EXPORT DATABASE format chosen for DuckDB-version independence (ADR-028) (0000018)"
    - "doctor's backup-staleness check (req-007) reads a sidecar JSON metadata file, never telemetry.db directly — avoids the single-writer-lock conflict doctor's pre-existing write-test check is independently exposed to (0000018)"
    - "Refuse-to-start exits 0 (ADR-030), matching both launchd's SuccessfulExit:false and systemd's Restart=on-failure, which already restart only on non-zero exit — no plist/unit change was required for the primary stay-stopped guarantee; ThrottleInterval/StartLimitBurst (ADR-031) remain as defense-in-depth against unrelated crash loops (0000018)"
    - "req-001 to req-004 all modify the same request-entry path in src/server-http.ts and must land as one integrated pass, not parallel edits — exact precedent is 0000017 R-002, which hit this with index-html.ts (0000019 R-002)"
    - "A request-body cap enforced only on Content-Length passes review but is bypassed by a chunked or forged-length request, leaving the original DoS intact — two independent enforcement points are required, and the streaming byte counter is the load-bearing one (0000019 R-003)"
    - "Reusing QueryShape unchanged on the HTTP path closes only the string-limit case: z.number() admits -5, 1.5 and 1e21, and offset is undeclared under .passthrough(), so the offset defect exists on the MCP path too. The gate must be tightened, not merely shared (0000019 R-005)"
    - "Error redaction applied only to the two HTTP sites leaves src/server-factory.ts:204 leaking the same engine text straight into an agent's context — all three sites must be fixed together (0000019 R-006)"
    - "An allow-list check written as a bare property lookup admits constructor/__proto__/prototype as inherited members; the injection corpus must include all three (0000019 R-007)"
    - "The Host check must compare against the actually-bound port from server.address(), not the configured PORT constant, or it locks out the ephemeral-port E2E harness that binds via port 0 (0000019 R-008, 0000016 R-002)"
    - "New security tests written to pass against current behaviour rather than to fail against broken behaviour would reproduce the exact defect this feature exists to fix — req-009 and req-010 each require a real RED-before-GREEN cycle, per the precedent 0000018 set for its P5 fixes (0000019 R-011)"
    - "The Origin/Host checks refusing a legitimate non-browser client would stop telemetry, and possibly silently, since hook-side handling of a non-2xx is unverified (backlog 00028) — mitigated by accepting requests that carry no Origin at all (0000019 R-001)"
    - "The false 'Service is healthy' health check (verify_service() in service-macos.sh, curl-only, no body inspection) is fixed via an additive buildId fingerprint on GET /health, compared by deploy across all three platform paths (req-008); orphan-port detection (req-009) closes the sibling case of an unmanaged process answering on the port (0000018)"

quality:
  testCoverage:
    unit: 229   # 491 Vitest tests across 28 files as of 0000018 (229 unit + 124 integration + 137 regression + 1 performance), plus 26 bats tests (tests/bats/, was 23 — +3 for req-005's supervision-config keys; not counted here — separate framework/CI job). Includes P5 security-fix regression coverage: sqlPathLiteral() escaping + backup-timer reentrancy guard, both verified with real RED-before-GREEN cycles.
    integration: 124
    e2e: 22   # @playwright/test, Chromium-only: unchanged from 0000017 — no new HTTP/UI surface added by 0000018 (deploy/backup/doctor are CLI/daemon-lifecycle, outside the E2E suites' scope)
    performanceGate: "p95 < 100ms (CI-tolerant; Windows GH runners measured ~28ms p95)"
  techDebt:
    - "AJV 8 uses `export =` incompatible with NodeNext ESM default imports. Isolated in src/validation/ajv-instance.ts using createRequire + cast pattern. Will self-resolve if AJV ships a native ESM build."
    - "data.anyOf in telemetry-event.schema.json is not discriminated by event type — addressed by cross-field validation in src/validation/validate-event.ts (EVENT_REQUIRED_DATA_FIELDS map). Changed from oneOf to anyOf in 0.3.0 when ContextResetData and PhaseSkipData became structurally identical; anyOf is correct since cross-field validation handles semantic discrimination. Future improvement: if/then/else or unevaluatedProperties in JSON Schema."
  quirks:
    - "server-http.ts previously had no HTTP-level test coverage (routes were tested indirectly via server-factory.ts's exported handlers, and GET /ui via its exported INDEX_HTML content plus manual browser verification, 0000015) — resolved by tests/e2e/backend/ and tests/e2e/ui/ (0000016), which start a real server-http.ts process and issue real HTTP/browser requests against it."
    - "E2E suites (tests/e2e/) run against src/server-http.ts via tsx (matching npm run dev), not the bundled server-http.bundle.mjs artifact — bundling itself is covered separately by the existing CI build step (0000016)."
    - "DuckDB's TIMESTAMPTZ::VARCHAR cast renders space-separated with a bare (colonless) UTC offset (e.g. \"2026-08-01 11:00:00+01\"), not ISO 8601 — client-side Date parsing of raw /query timestamp output must normalize this first (tests/e2e/support/fixtures.ts's parseDbTimestamp, 0000016)."
    - "INDEX_HTML is embedded as a TypeScript template-literal string (src/ui/index-html.ts), not a separate static file — same reason schemas/telemetry-event.schema.json is inline-imported: runtime path resolution to sibling files breaks once esbuild bundles server-http.ts into a single .mjs file (0000015, ADR-018)."
    - "@duckdb/node-api named params require prepare().bind({name}).runAndReadAll() — positional ? binding is unsupported in this version."
    - "DuckDB does not support PRAGMA wal_mode — WAL is managed internally, pragma removed from schema init."
    - "Zod v4 arrives as a transitive dep (not declared by MCP SDK's own package.json); pinned explicitly to ^4.0.0 to prevent accidental downgrade."
    - "Vitest 4 (Rolldown) does not transform .cts files — .cts adapters cannot be used for CJS interop in this project."
    - "TypeScript 6 no longer implicitly includes Node.js types — requires explicit types: [node] in tsconfig.json."
    - "sampleEvents helpers in failures.ts and token-efficiency.ts accept a WHERE clause string — callers must always use named params ($param) rather than string interpolation for any user-supplied values."
    - "See src/structured-telemetry-mcp/docs/quirks.md — macOS/Linux service scripts have a bats harness (tests/bats/, 23 tests as of 0000012) covering pure-logic paths only; real install/uninstall against a live launchctl/systemd service remains manual verification. service-linux.sh is still untested against real systemd hardware (risk-register R-002, backlog 00001, blocked on a host-level Multipass networking issue as of 0000012)."
    - "distinct_values' field param uses real column names (event, not event_type) per ADR-024, diverging from event_log's filter-param naming; the frontend bridges this with a small SUGGEST_FIELD_COLUMN map (0000017, docs/quirks.md)"
    - "index-html.ts hand-mirrors SORTABLE_FIELDS/SUGGESTIBLE_FIELDS from src/query/column-allow-list.ts as client-side constants — no import mechanism at runtime (ADR-018), so a future backend allow-list change must be manually synced into the frontend copy (0000017, docs/quirks.md)"
    - "pollForUpdates() required a post-implementation fix to toggle table/pager visibility on a genuine zero-result poll response, so auto-refresh actually reveals new rows when starting from an empty state — covered by a new E2E test (0000017, docs/quirks.md)"

