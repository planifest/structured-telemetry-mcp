# Planifest Component Manifest
id: "structured-telemetry-mcp"
name: "Structured Telemetry MCP Server"
feature: "0000008c-mcp-fixes-and-enhancements"
version: "0.2.0"
status: "active"
type: "microservice"
domain: "observability"
summary: "MCP server that ingests and queries structured telemetry events from Planifest pipeline runs."
systemContext: "Runs as a local MCP server alongside the developer's agent tool (Claude Code, Cursor, etc.). Planifest-compliant agents call emit_event to record pipeline telemetry. The human on the loop calls query_telemetry to analyse bottlenecks, failures, and token efficiency. The DuckDB store is the data source for the future 0024 observability dashboard."

responsibilities:
  - "Accept and validate telemetry events via the emit_event MCP tool (14 event types as of 0.2.0)"
  - "Persist all valid events to a DuckDB store with temporal optimisation"
  - "Answer structured queries via the query_telemetry MCP tool across three query families plus event_log"
  - "Enforce JSON Schema validation for all event types at ingestion"
  - "Provide setup and doctor CLI commands for installation and diagnostics"
  - "Expose a build and bundle pipeline producing server.bundle.mjs, server-http.bundle.mjs, and cli.bundle.mjs"
  - "Support initiative_id-scoped filtering on all query families"
  - "Provide human-only post-deployment truncation scripts with admin/sudo gate and interactive phrase confirmation"

exceptions:
  - "Does not emit telemetry itself — it is the sink, not a source"
  - "Does not detect loops server-side — loop detection is query-side only"
  - "Does not update planifest-framework skills or setup scripts (0008b — separate pipeline run)"
  - "Does not provide a web dashboard or visualisation layer (0024 — future)"
  - "Does not publish to npm this pipeline run"
  - "Does not run in the cloud or as a hosted service"
  - "Does not authenticate callers — bound to 127.0.0.1, no auth model required"

stack:
  language: "typescript"
  runtime: "node"
  framework: "express"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "duckdb"
  orm: "none"
  testing: "vitest"
  iac: "none"
  cloud: "none"
  compute: "local-daemon"
  ci: "github-actions"

contract:
  apiSpec: "none"
  inputs:
    - name: "emit_event"
      type: "event"
      description: "Accepts a telemetry event envelope + typed payload; validates and writes to DuckDB"
    - name: "query_telemetry"
      type: "event"
      description: "Accepts a structured query; returns aggregated Markdown + JSON + raw event sample"
  outputs:
    - name: "emit_event response"
      type: "event"
      description: "{ ok: true, id } on success or { ok: false, errors } on validation/storage failure"
    - name: "query_telemetry response"
      type: "event"
      description: "Markdown table + JSON payload + raw event sample (5 events)"
  consumedBy: []
  consumes: []
  breakingChangePolicy: "requires-adr"

data:
  ownsData: true
  dataContract: "src/structured-telemetry-mcp/docs/data-contract.md"
  tables:
    - "events"
  schemaVersion: "1.0"
  migrationPath: "src/structured-telemetry-mcp/docs/migrations/"

scope:
  inScope:
    - "emit_event MCP tool — 14 event types (9 carried from 0008a + 5 new in 0008c)"
    - "query_telemetry MCP tool — bottlenecks, failures, token-efficiency, event_log"
    - "initiative_id filter on all query families"
    - "group_by: mcp_mode and group_by: initiative_id for bottleneck queries"
    - "DuckDB storage layer"
    - "JSON Schema validation for all 14 event types"
    - "Setup and doctor CLI commands"
    - "HTTP/SSE daemon transport on 127.0.0.1:3741"
    - "Build and bundle pipeline (server.bundle.mjs, server-http.bundle.mjs, cli.bundle.mjs)"
    - "GitHub Actions CI with platform matrix (ubuntu/macos/windows × node20/22)"
    - "Performance test (p95 < 100ms gate)"
    - "Human-only post-deployment truncation scripts with admin/sudo and interactive phrase gate"
  outOfScope:
    - "0008b framework integration"
    - "npm publish"
    - "Remote hosting"
    - "Web dashboard"
    - "Server-side loop detection"
    - "Authentication or access control"
  deferred:
    - "npm publish — blocked on: decision to make package public"
    - "Plugin marketplace manifests — blocked on: marketplace listing decision"

risk:
  level: "low"
  items:
    - "express missing from package.json dependencies — build fails if not present (R-005)"
    - "initiative_id nullable — COALESCE required in group_by to avoid null group keys (R-002)"
    - "event_log dispatch order — must precede existing checks in dispatchQuery (R-003)"
    - "AJV recompilation — schema additions only active after daemon restart (R-004)"
    - "Truncation script DB path resolution — must print path before prompting (R-006)"

quality:
  testCoverage:
    unit: 98   # 152 total tests across 7 files as of 0.2.0 (unit + integration)
    integration: 54
    e2e: 0
    performanceGate: "p95 < 100ms (CI-tolerant; Windows GH runners measured ~28ms p95)"
  techDebt:
    - "AJV 8 uses `export =` incompatible with NodeNext ESM default imports. Isolated in src/validation/ajv-instance.ts using createRequire + cast pattern. Will self-resolve if AJV ships a native ESM build."
    - "data.oneOf in telemetry-event.schema.json is not discriminated by event type — addressed in 0.2.0 by cross-field validation in src/validation/validate-event.ts (EVENT_REQUIRED_DATA_FIELDS map). Schema itself still uses unguarded oneOf; a future improvement is if/then/else or unevaluatedProperties in JSON Schema."
  quirks:
    - "@duckdb/node-api named params require prepare().bind({name}).runAndReadAll() — positional ? binding is unsupported in this version."
    - "DuckDB does not support PRAGMA wal_mode — WAL is managed internally, pragma removed from schema init."
    - "Zod v4 arrives as a transitive dep (not declared by MCP SDK's own package.json); pinned explicitly to ^4.0.0 to prevent accidental downgrade."
    - "Vitest 4 (Rolldown) does not transform .cts files — .cts adapters cannot be used for CJS interop in this project."
    - "TypeScript 6 no longer implicitly includes Node.js types — requires explicit types: [node] in tsconfig.json."
    - "sampleEvents helpers in failures.ts and token-efficiency.ts accept a WHERE clause string — callers must always use named params ($param) rather than string interpolation for any user-supplied values."

pipeline:
  templateVersion: "1.0.0"
  featureMode: "retrofit"
  domainKnowledgePath: "plan"

