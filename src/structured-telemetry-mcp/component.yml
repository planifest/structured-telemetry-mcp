    - "Backend E2E suite (tests/e2e/backend/, @playwright/test): black-box HTTP coverage for /emit, /query (event_log filtering/pagination/sort), /health against a real server + ephemeral DuckDB per run (0000016)"
    - "UI E2E suite (tests/e2e/ui/, @playwright/test, Chromium-only): browser-driven coverage for GET /ui — filters, URL-state, pagination, zero-result state, row-click detail view (0000016)"
    - "Interactive use of the Playwright MCP server during P3 codegen for E2E test authoring/verification — not part of the CI-executed runtime (0000016)"
    - "event_log sortField param, allow-listed (timestamp, event, session_id, phase, agent, product_id), defaults to timestamp — real per-column sort replacing the previous hardcoded ORDER BY timestamp (0000017)"
    - "distinct_values query mode: allow-listed field, optional prefix-match q, capped at 20 results (0000017)"
    - "GET /ui: auto-refresh/tail-mode toggle (interval polling, never blanks table, degrades gracefully on poll failure), filter-value suggestion comboboxes (<datalist>-based) on the 6 filterable fields, clickable sortable column headers three-way synced with the sort-field/direction control and URL query params (0000017)"
