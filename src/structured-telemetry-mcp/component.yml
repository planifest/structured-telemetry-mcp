# Planifest Component Manifest
id: "structured-telemetry-mcp"
name: "Structured Telemetry MCP Server"
feature: "0000019-loopback-daemon-hardening"
version: "0.15.0"
status: "active"
type: "microservice"
domain: "observability"
summary: "MCP server that ingests and queries structured telemetry events from Planifest pipeline runs."
systemContext: "Runs as a local MCP server alongside the developer's agent tool (Claude Code, Cursor, etc.). Planifest-compliant agents call emit_event to record pipeline telemetry. The human on the loop calls query_telemetry to analyse bottlenecks, failures, and token efficiency. The DuckDB store is the data source for the future 0024 observability dashboard. As of 0000010, also installs as a boot-surviving background service on macOS (launchd) and Linux (systemd --user), alongside the existing Windows (nssm) path."

responsibilities:
  - "Accept and validate telemetry events via the emit_event MCP tool (25 event types as of 0.10.0)"
  - "Persist all valid events to a DuckDB store with temporal optimisation"
  - "Answer structured queries via the query_telemetry MCP tool across three query families plus event_log, backed by a real permissive object-shaped Zod tool-argument schema (not z.unknown()) as of 0.10.1"
  - "Enforce JSON Schema validation for all event types at ingestion, backed by a real object-shaped Zod tool-argument schema (not z.unknown())"
  - "Provide setup and doctor CLI commands for installation and diagnostics"
  - "Expose a build and bundle pipeline producing server.bundle.mjs, server-http.bundle.mjs, and cli.bundle.mjs"
  - "Support initiative_id-scoped filtering on all query families"
  - "Provide human-only post-deployment truncation scripts with admin/sudo gate and interactive phrase confirmation"
  - "Install, manage, and supervise itself as a user-scoped background service on macOS (launchd) and Linux (systemd --user), mirroring the existing Windows (nssm) service scripts"
  - "Tag events with an optional product_id (repo root path) so events from multiple projects sharing one telemetry DB can be distinguished (0000015)"
  - "Serve a static, read-only browser UI (GET /ui) for browsing, filtering, and paging telemetry events (0000015)"
  - "Support offset-based pagination, total_count, sort order, and phase/agent/product_id/timestamp-range filters on event_log queries, with no scope filter required — every query is bounded solely by limit/offset (0000015, supersedes ADR-010's mandatory-scope-filter rule)"
  - "Support a sortField param on event_log queries (allow-listed: timestamp, event, session_id, phase, agent, product_id; defaults to timestamp, non-breaking) — real per-column sort, replacing the previous direction-only, timestamp-hardcoded ORDER BY (0000017)"
  - "Serve a distinct_values query mode returning up to 20 allow-listed-field distinct values (optional prefix-match), powering the UI's filter-suggestion comboboxes (0000017)"
  - "Support user-toggleable auto-refresh/tail polling, filter-value suggestions, and three-way-synced (header/dropdown/URL) sortable columns in the GET /ui log viewer, with all new UI state persisted via URL query params degrading gracefully to defaults when absent/malformed (0000017)"
  - "Checkpoint the DuckDB WAL on graceful shutdown (SIGTERM/SIGINT) and periodically (every 60s or 100 events, whichever first), bounding the data-at-risk window on an unclean kill to that same threshold (0000018)"
  - "Checkpoint immediately after any startup ALTER TABLE ADD COLUMN migration, so no schema-migration WAL entry is ever left pending replay (0000018)"
  - "Refuse to start when the database is locked or its WAL is unreplayable, printing the file, conflicting PID where available, and the recovery procedure — the WAL is never deleted, truncated, or modified (0000018, decision D)"
  - "Take a daily verified backup via EXPORT DATABASE, ordered strictly verify -> promote -> prune, retained 7 daily + 4 weekly, recording the outcome to a sidecar metadata file that `doctor` reads instead of opening the live database (0000018)"
  - "Report the age of the most recent verified backup (or 'no verified backup') via `npm run doctor`, sourced from the sidecar metadata file so the check works even while the daemon holds the DuckDB lock (0000018)"
  - "Expose an additive build-identity fingerprint (`buildId`, a SHA-256 hash of server-http.bundle.mjs) on GET /health, letting `npm run deploy` detect a stale running daemon even at an unchanged version string (0000018, decision A)"
  - "Detect, during `npm run deploy`, a process bound to the daemon's port that launchd/systemd does not manage, and refuse to report success while naming that process rather than killing it (0000018)"
  - "Append a uniqueness tiebreaker (`id`) to every event-log ORDER BY, guaranteeing a full pagination returns each row exactly once regardless of duplicate values in the sorted field (0000018)"
  - "Validate every inbound HTTP request against a Host allow-list (127.0.0.1:<PORT> / localhost:<PORT>, compared against the actually-bound port) before routing, closing DNS rebinding (0000019, req-001)"
  - "Refuse a request carrying a foreign Origin, while accepting one with no Origin at all — the stdio proxy and emission hooks are non-browser clients and send none (0000019, req-002, ADR-009)"
  - "Require Content-Type: application/json on POST /emit and POST /query, closing the CORS-simple no-preflight write path (0000019, req-003)"
  - "Cap request bodies at PLANIFEST_MAX_BODY_BYTES (4 MB) at two independent enforcement points — a Content-Length pre-check and a streaming byte counter — so a chunked or forged-length request cannot bypass the cap, and survive the attempt rather than exiting (0000019, req-004)"
  - "Apply one shared validation gate across the HTTP and MCP query paths, with per-mode integer/range ceilings on limit (event_log 1000, distinct_values 20 — changed from clamp to reject, failure_sequence/drill_down 1000 new), offset, loop_threshold, and limit-as-day-count when mode is trend (there is no separate trend.limit field) (0000019, req-005)"
  - "Return redacted error bodies carrying a correlation id, with the full error and stack written to stderr against the same id; 500 for engine failures, 400 reserved for validated client input (0000019, req-006)"
  - "Bound failure_sequence and drill_down by MAX_LIMIT with additive truncated and total_count fields, total_count computed by a count query rather than by counting materialised rows (0000019, req-007)"
  - "Cap assembled MCP tool-result text at PLANIFEST_MCP_TEXT_BUDGET, truncating at section boundaries so the agent never receives a half-serialised JSON block (0000019, req-008)"

exceptions:
  - "Does not emit telemetry itself — it is the sink, not a source"
  - "Does not detect loops server-side — loop detection is query-side only"
  - "Does not update planifest-framework skills or setup scripts (0008b — separate pipeline run)"
  - "Does not provide an aggregation/dashboard view (bottleneck/failure/token-efficiency charts) in the UI — those remain MCP/REST-only (0024 — future; also plan/current/scope.md Deferred as of 0000015)"
  - "Does not publish to npm this pipeline run"
  - "Does not run in the cloud or as a hosted service"
  # REVISED at 0000019 P2 per ADR-032 (accepted 2026-08-08). ADR-032 is now
  # accepted — the DECISION is settled — but req-001/req-002's code lands at
  # P3, not yet. Until P3 lands, no code in this tree actually checks Host or
  # Origin: this entry states the target behaviour this feature is building
  # toward, not yet the running behaviour. The original entry (0000015) read
  # "Does not authenticate callers — bound to 127.0.0.1, no auth model
  # required, including for the new UI", reasoned against a multi-user threat
  # model that never considered browser-mediated attack, where the
  # developer's own browser sits inside the trust boundary. ADR-032 narrows
  # that claim rather than removing it: still no credential, and once P3
  # lands, provenance will be checked too.
  - "Does not authenticate callers with any credential — no token, password, or key (ADR-032 deliberately rejects a shared secret; see its Alternatives table). Caller *provenance* will be checked instead, once P3 lands: a Host allow-list and Origin rejection (0000019, req-001, req-002, ADR-032) — the decision is accepted as of this P2 manifest revision, the code is not"
  - "Does not support multi-user access control — there is one local user, and distinguishing between humans remains out of scope (0000015, unaffected by ADR-032, which is about caller provenance, not about telling multiple humans apart)"
  - "Does not install a system-level (root) launchd daemon or root systemd unit — user-scoped service only"
  - "Does not auto-fix a root-owned ~/Library/LaunchAgents or auto-enable systemd lingering — both require explicit human action"
  - "Does not support editing or deleting events from the UI — read-only viewer (0000015)"
  - "Does not backfill product_id on historical rows — no reliable signal exists; other projects besides this repo have also used the shared DB (0000015)"
  - "Does not populate product_id in planifest-framework's own emission hooks — that is a separate product's responsibility, tracked at plan/backlog/00002-framework-product-id-emission (0000015)"
  - "Does not provide aggregation/dashboard views (bottleneck/failure/token-efficiency charts) in the UI — deferred to backlog #00004, blocked on a future ADR-018 revisit (0000017)"
  - "Does not push live updates via WebSocket/SSE — auto-refresh is interval-based polling only (0000017, A-001)"
  - "Does not support quick date-range filter presets (today/yesterday/last N days) — filed as backlog #00006, not part of this wave (0000017)"
  - "Does not sort or suggest on any events column outside the fixed 6/7-value allow-lists — no arbitrary column sort/suggestion (0000017, R-001)"
  - "Does not queue, buffer, or retry client-side for events emitted while the daemon is down or refusing to start — those events are lost, not delayed (0000018)"
  - "Does not auto-remediate a locked or poisoned-WAL database — refuses to start and leaves the WAL untouched for manual recovery; auto-copy-aside was considered and explicitly not chosen (0000018, decision D)"
  - "Does not recover the ~4,100 events already stranded in the pre-existing unreplayable WAL from the 2026-08-03 incident — tracked separately at backlog #00023, explicitly deferred (0000018)"
  # RESOLVED by 0000019. 0000018 recorded this as out of scope and named the
  # backlog entries; this feature is that follow-up. All six (00010-00014,
  # 00020) are now delivered, so the exception no longer holds and is replaced
  # by the narrower residual exclusions below.
  - "Does not drain in-flight requests on SIGTERM — server.close() keeps its existing semantics and the interaction between an in-flight request and the shutdown checkpoint is unspecified. Surfaced at 0000019 P0 and deliberately excluded as 0000018 shutdown-path surface, not request-boundary surface"
  - "Does not emit CORS response headers — cross-origin access will be refused, not negotiated, once req-002 lands at P3; adding Access-Control-Allow-Origin would defeat the Origin check. Not yet true of the running code as of this P2 manifest revision (0000019, req-002)"
  - "Does not change the uncaughtException -> process.exit(1) policy — 0000019 stops the request path from reaching it, but the handler itself is unchanged and other crash paths still exit (0000019, 00013 action 5 not adopted)"
  - "Does not guarantee that a refused /emit is surfaced to the caller as a telemetry failure — the daemon returns a structured 400, but whether the emission hooks write a failure marker for it is framework-side, tracked at plan/backlog/00028 (0000019)"
  - "Does not migrate event-log pagination away from limit/offset to keyset pagination — the id tiebreaker works within the existing ADR-016 bounding strategy, not instead of it (0000018)"

stack:
  language: "typescript"
  runtime: "node"
  framework: "none"
  frontend: "vanilla-js (no build step, no framework — 0000015, ADR-018)"
  styling: "inline-css"
  componentLibrary: "none"
  database: "duckdb"
  orm: "none"
  testing: "vitest"
  iac: "none"
  cloud: "none"
  compute: "local-daemon"
  ci: "github-actions"

contract:
  # 0000019 introduces a formal contract for the HTTP surface. The boundary is
  # exactly what this feature changes, so a language-agnostic statement of it is
  # what P3, P4 and P5 verify against. Drafted at P1 to
  # plan/current/openapi-spec.yaml; P6 publishes it to the living path below,
  # since plan/current/ archives at P7 and a contract must not point into an
  # archive.
  apiSpec: "pending-p6: src/structured-telemetry-mcp/docs/openapi-spec.yaml (draft at plan/current/openapi-spec.yaml)"
  inputs:
    - name: "emit_event"
      type: "event"
      description: "Accepts an `envelope` argument (renamed from `event` in 0.10.0) — a real object-shaped Zod schema, not z.unknown(); validates and writes to DuckDB"
    - name: "query_telemetry"
      type: "event"
      description: "Accepts a structured query via a permissive object-shaped Zod schema (QueryShape, not z.unknown() as of 0.10.1); returns aggregated Markdown + JSON + raw event sample. event_log mode gains an allow-listed sortField param (0000017). New mode: distinct_values, for allow-listed-field suggestion lookups (0000017)."
    - name: "GET /ui"
      type: "http"
      description: "New (0000015): serves the static browser log-viewer page from the same server-http.ts process. No new port/process."
    - name: "GET /health"
      type: "http"
      description: "Liveness check, used by the platform service scripts to verify install/restart. Gains an additive `buildId` field as of 0000018 (SHA-256 hash of server-http.bundle.mjs) alongside the existing `ok`/`version` fields, letting `npm run deploy` detect a stale daemon at an unchanged version string."
  outputs:
    - name: "emit_event response"
      type: "event"
      description: "{ ok: true, id } on success or { ok: false, errors } on validation/storage failure"
    - name: "query_telemetry response"
      type: "event"
      description: "Markdown table + JSON payload + raw event sample (5 events); on a zero-row result for a session_id/initiative_id-scoped query, an additive `hint` field/markdown note names other event types found for that scope, if any (0000014). event_log responses additionally include `total_count` as of 0000015. distinct_values responses return `{ mode, field, values }` (0000017)."
  consumedBy: []
  consumes: []
  breakingChangePolicy: "requires-adr"

data:
  ownsData: true
  dataContract: "src/structured-telemetry-mcp/docs/data-contract.md"
  tables:
    - "events"
  schemaVersion: "1.0"
  migrationPath: "src/structured-telemetry-mcp/docs/migrations/"

