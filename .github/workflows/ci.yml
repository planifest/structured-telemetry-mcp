name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck / test / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration + performance)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bundles exist
        shell: bash
        run: |
          test -f server.bundle.mjs || (echo "server.bundle.mjs missing" && exit 1)
          test -f cli.bundle.mjs    || (echo "cli.bundle.mjs missing"    && exit 1)
