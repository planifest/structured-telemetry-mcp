name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-branch:
    name: Planifest doc/code parity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Code/Doc Parity
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          COMMIT_MESSAGES=$(git log origin/${{ github.base_ref }}...HEAD --format="%s")

          FAST_PATH_COUNT=$(echo "$COMMIT_MESSAGES" | grep -cE "^fix\(fast-path\):" || true)
          TOTAL_COUNT=$(echo "$COMMIT_MESSAGES" | grep -c "." || true)

          if [ "$FAST_PATH_COUNT" -gt 0 ] && [ "$FAST_PATH_COUNT" -eq "$TOTAL_COUNT" ]; then
            if echo "$CHANGED_FILES" | grep -q "^src/"; then
              if ! echo "$CHANGED_FILES" | grep -qE "(component\.json|plan/changelog/)"; then
                echo "::error title=Planifest Fast Path Violation::Fast Path commits must update component.yml or plan/changelog/."
                exit 1
              fi
            fi
            echo "✅ Planifest fast-path pipeline passed."
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qE "^(plan/|docs/|.*component\.json)"; then
              echo "::error title=Planifest Strict Violation::Code modified without corresponding updates to plan/, docs/, or component.yml."
              exit 1
            fi
          fi
          echo "✅ Planifest pipeline passed."

  ci:
    name: typecheck / test / build (${{ matrix.os }}, node${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit + integration + performance)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bundles exist
        shell: bash
        run: |
          test -f server.bundle.mjs || (echo "server.bundle.mjs missing" && exit 1)
          test -f cli.bundle.mjs    || (echo "cli.bundle.mjs missing"    && exit 1)

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E suites (backend + ui)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi

      - name: Run service script tests
        run: bats tests/bats/
